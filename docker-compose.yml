services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hormozi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hormozi']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/hormozi
      PORT: 3001
    ports:
      # Publiek bereikbaar op poort 3001 (alle interfaces). Let op: dit is kale
      # HTTP zonder versleuteling. Zet er later een reverse proxy met HTTPS voor
      # als de app gevoelige data verwerkt of op een domein moet draaien.
      - '0.0.0.0:3001:3001'
    volumes:
      # Je documenten staan op de host; zo kun je bestanden toevoegen en opnieuw
      # ingesten zonder de image te herbouwen.
      - ./knowledge:/app/knowledge
    restart: unless-stopped

volumes:
  pgdata:
